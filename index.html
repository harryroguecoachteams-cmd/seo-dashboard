<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F4E51'/%3E%3Cpath d='M16 44l10-12 8 7 14-17' stroke='%23fff' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<title>SEO dashboard · JB Skincare and Skinolin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
<style>
:root{--bg:#F3F5F6;--card:#FFFFFF;--ink:#13222A;--muted:#5C6C74;--faint:#8A989F;--line:#E1E7EA;--soft:#EEF2F4;
  --accent:#1F4E51;--tint:#E4F2EF;--good:#11704F;--goodbg:#E1F3EA;--bad:#AE2A1F;--badbg:#FBEAE8;--cmp:#C3CDD2;--r:14px}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.muted{color:var(--muted)}
/* lock */
.lock{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(1200px 600px at 50% -10%,#E4F2EF 0%,var(--bg) 60%)}
.lockcard{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 12px 40px rgba(19,34,42,.08)}
.mark{font-weight:700;letter-spacing:.14em;font-size:12px;color:var(--accent)}
.mark span{letter-spacing:0;font-weight:500;color:var(--muted);margin-left:8px;font-size:13px}
.lockcard h1{font-size:26px;line-height:1.2;margin:14px 0 4px}
.lockcard p{margin:0 0 22px;color:var(--muted)}
label.f{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.inp{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(31,78,81,.15)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:12px 18px;font-weight:600;background:var(--accent);color:#fff}
.btn.full{width:100%;margin-top:14px}
.btn[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:14px;margin-top:10px;min-height:20px}
.fine{font-size:12px;color:var(--faint);margin-top:16px}
/* top bar */
.top{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.topin{display:flex;align-items:center;gap:16px;min-height:60px;flex-wrap:wrap}
.top .mark{white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:10px;margin-left:auto}
.tabs a{text-decoration:none;padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs a.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(19,34,42,.12)}
.ghost{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:14px;color:var(--muted);text-decoration:none}
.ghost:hover{color:var(--ink);border-color:#C9D3D8}
/* chooser */
.h1{font-size:30px;line-height:1.2;margin:36px 0 6px}
.lede{color:var(--muted);margin:0 0 24px;max-width:720px}
.brands{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
.bcard{display:block;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;border-top:5px solid var(--accent);transition:box-shadow .15s,transform .15s}
.bcard:hover{box-shadow:0 10px 30px rgba(19,34,42,.10);transform:translateY(-2px)}
.bname{font-size:24px;font-weight:700}
.bdom{color:var(--muted);font-size:14px;margin-bottom:18px}
.bstats{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:16px;background:var(--tint);border-radius:12px}
.bstats .v{font-size:26px;font-weight:700;line-height:1.2}
.bfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;font-size:14px;color:var(--muted);flex-wrap:wrap}
.go{color:var(--accent);font-weight:600}
.note{color:var(--faint);font-size:13px;margin:22px 0 40px}
/* dashboard */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:30px 0 20px}
.head h1{font-size:32px;line-height:1.15;margin:0}
.head .sub{color:var(--muted);margin-top:6px}
.head .sub a{color:var(--accent);text-decoration:none;font-weight:500}
.cmpbox{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.cmpbox .k{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
.seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:7px 12px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);text-align:left;line-height:1.25}
.seg button small{display:block;font-weight:500;color:var(--faint);font-size:11.5px}
.seg button[aria-pressed=true]{background:var(--tint);color:var(--ink)}
.seg button[aria-pressed=true] small{color:var(--muted)}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:6px;min-width:0}
.kpi .k{font-size:13px;font-weight:600;color:var(--muted)}
.kpi .v{font-size:30px;font-weight:700;line-height:1.1;letter-spacing:-.01em}
.kpi.small .v{font-size:24px}
.kpi .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .was{font-size:13px;color:var(--faint)}
.kpi .help{font-size:12.5px;color:var(--faint);line-height:1.4}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.chip.good{background:var(--goodbg);color:var(--good)}
.chip.bad{background:var(--badbg);color:var(--bad)}
.chip.flat{background:var(--soft);color:var(--muted)}
.chip:empty{display:none}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:18px}
.sech{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.sech h2{font-size:19px;margin:0 0 4px;line-height:1.3}
.sech p{margin:0;color:var(--muted);font-size:14px;max-width:680px}
.split{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:center}
.chartbox{position:relative;height:270px}
.chartbox.tall{height:300px}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;font-weight:600;color:var(--muted);background:#F8FAFB;white-space:nowrap;position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.kw{font-weight:600;min-width:180px}
td.pg{color:var(--muted);min-width:160px}
td.url{min-width:220px;word-break:break-word}
td.url a{text-decoration:none;color:var(--ink)}
td.url a:hover{color:var(--accent);text-decoration:underline}
tr.tot td{font-weight:700;background:#F8FAFB}
.low{color:var(--faint);font-style:italic}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pill{background:var(--soft);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.pill b{display:block;font-size:20px;color:var(--ink);line-height:1.2}
.pill.good b{color:var(--good)}
.pill.bad b{color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.tools .inp{max-width:300px;padding:9px 12px}
.sel{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.more{margin-top:12px}
.tag{font-size:11px;font-weight:600;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 6px;margin-left:6px;white-space:nowrap}
.sm{display:none}
.foot{color:var(--faint);font-size:12.5px;margin:26px 0 40px;line-height:1.6}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
@media (max-width:900px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.split{grid-template-columns:1fr}}
@media (max-width:560px){.wrap{padding:0 16px}.head h1{font-size:26px}.h1{font-size:25px}.kpi .v{font-size:24px}.kpi.small .v{font-size:20px}.sec{padding:16px}
  .tabs{margin-left:0;width:100%}.tabs a{flex:1;text-align:center}.topin{padding:10px 0;gap:10px}.chartbox{height:230px}.bstats .v{font-size:22px}}
@media (max-width:560px){.top{position:static}.topin{gap:8px}.top .mark{flex:1}.top .mark span{display:none}
  .tabs{order:3}.ghost{padding:6px 10px;font-size:13px}th.pg,td.pg,th.vol,td.vol,th.hp,td.hp{display:none}th,td{padding:8px 6px}.chip{font-size:11.5px;padding:2px 6px}table{font-size:13px}td.kw{min-width:0}td.url{min-width:96px;word-break:break-all}td.url{min-width:180px}.topin{padding:10px 16px}.lg{display:none}.sm{display:inline}
  table.rk th,table.rk td{padding:8px 6px}
  table.pt,table.kt{table-layout:fixed}table.pt th:nth-child(1){width:44%}table.pt th:nth-child(2){width:16%}table.pt th:nth-child(3){width:24%}table.pt th:nth-child(5){width:16%}
  table.kt th:nth-child(1){width:38%}table.kt th:nth-child(4){width:19%}table.kt th:nth-child(5){width:19%}table.kt th:nth-child(6){width:24%}td.url{min-width:0}table.rk td:first-child{min-width:96px}}
</style>
</head>
<body>
<noscript><p style="padding:24px">This dashboard needs JavaScript.</p></noscript>

<section id="lock" class="lock" hidden>
  <form class="lockcard" id="lockform" autocomplete="on">
    <div class="mark">LOCKNCODE</div>
    <h1>SEO dashboard</h1>
    <p>JB Skincare and Skinolin</p>
    <label class="f" for="pw">Password</label>
    <input class="inp" id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
    <button class="btn full" id="unlockbtn" type="submit">Open dashboard</button>
    <div class="err" id="lockerr" role="alert"></div>
    <div class="fine">The figures stay encrypted until the password is entered.</div>
  </form>
</section>
<div id="choose" hidden></div>
<div id="dash" hidden></div>

<script>
(() => {
'use strict';
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const nf = new Intl.NumberFormat('en-IN');
const S = {data:null, brand:null, cmp:'previous', rank:'all', kwq:'', kwb:'all', kwsort:'now', kwall:false, tm:'c', mm:'c', tq:'all', charts:{}};
const store = {get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}, del(k){try{sessionStorage.removeItem(k)}catch(e){}}};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

// ---------- data ----------
let ENC = null;
async function loadEnc(){ if (!ENC){ const r = await fetch('data.enc.json', {cache:'no-store'}); if (!r.ok) throw new Error('load'); ENC = await r.json(); } return ENC; }
async function decrypt(pw){
  const e = await loadEnc();
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(e.salt), iterations:e.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  let pt;
  try { pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct)); } catch (x) { throw new Error('password'); }
  return JSON.parse(new TextDecoder().decode(pt));
}

// ---------- formatting ----------
const P = iso => { const [y,m,d] = iso.split('-').map(Number); return {y,m,d}; };
const dm = iso => { const p = P(iso); return `${p.d} ${MON[p.m-1]}`; };
const rng = (a,b) => { const A = P(a), B = P(b); return A.y === B.y ? `${dm(a)} to ${dm(b)} ${B.y}` : `${dm(a)} ${A.y} to ${dm(b)} ${B.y}`; };
const N = x => nf.format(x);
function dCount(now, was){
  if (was == null) return {t:'', c:'flat'};
  if (!was) return now > 0 ? {t:'New', c:'good'} : {t:'No change', c:'flat'};
  const p = (now / was - 1) * 100;
  if (Math.abs(p) < 0.5) return {t:'No change', c:'flat'};
  return {t:`${p > 0 ? '▲' : '▼'} ${Math.abs(p).toFixed(0)}%`, c: p > 0 ? 'good' : 'bad'};
}
function dPts(now, was){ const x = now - was; if (Math.abs(x) < 0.05) return {t:'No change', c:'flat'}; return {t:`${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(1)} points`, c: x > 0 ? 'good' : 'bad'}; }
function dPos(now, was, words){
  if (now == null || was == null) return {t:'', c:'flat'};
  const x = was - now;
  if (Math.abs(x) < 0.05) return {t:'No change', c:'flat'};
  return {t:`${x > 0 ? '▲' : '▼'} ${Math.abs(x).toFixed(1)}${words ? (x > 0 ? ' places higher' : ' places lower') : ''}`, c: x > 0 ? 'good' : 'bad'};
}
const H = (lg, sm) => `<span class="lg">${lg}</span><span class="sm">${sm}</span>`;
const chip = d => `<span class="chip ${d.c}">${d.t}</span>`;
const bucketOf = p => { const r = Math.floor(p + 0.5); return r <= 3 ? 0 : r <= 10 ? 1 : r <= 20 ? 2 : 3; };
const BL = ['Top 3', '4 to 10', '11 to 20', '21 and lower'];
const cmpName = () => S.cmp === 'previous' ? 'Previous 28 days' : 'Before we started';
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

// ---------- screens ----------
function show(id){ for (const s of ['lock','choose','dash']) $('#' + s).hidden = s !== id; window.scrollTo(0, 0); }
function topbar(active){
  const tabs = S.data.brands.map(b => `<a href="#${b.id}" class="${b.id === active ? 'on' : ''}">${esc(b.name)}</a>`).join('');
  return `<header class="top"><div class="wrap topin"><div class="mark">LOCKNCODE<span>SEO dashboard</span></div>
    ${active ? `<nav class="tabs" aria-label="Brand">${tabs}</nav><a class="ghost" href="#">All brands</a>` : '<span style="margin-left:auto"></span>'}
    <button class="ghost" data-act="lock" type="button">Lock</button></div></header>`;
}
function renderChoose(){
  const d = S.data;
  document.documentElement.style.setProperty('--accent', '#1F4E51'); document.documentElement.style.setProperty('--tint', '#E4F2EF');
  $('#choose').innerHTML = topbar(null) + `<main class="wrap"><h1 class="h1">Choose a brand</h1>
    <p class="lede">How each site is doing in Google Search: the last 28 days compared with the 28 days before. Updated ${esc(d.updated)}.</p>
    <div class="brands">${d.brands.map(b => { const L = b.totals.latest, V = b.totals.previous; return `
      <a class="bcard" href="#${b.id}" style="--accent:${b.accent};--tint:${b.tint}">
        <div class="bname">${esc(b.name)}</div><div class="bdom">${esc(b.domain)}</div>
        <div class="bstats"><div><div class="muted" style="font-size:13px">Clicks from Google</div><div class="v">${N(L.clicks)}</div>${chip(dCount(L.clicks, V.clicks))}</div>
        <div><div class="muted" style="font-size:13px">Views in Google</div><div class="v">${N(L.impr)}</div>${chip(dCount(L.impr, V.impr))}</div></div>
        <div class="bfoot"><span>October plan: ${b.facts.done[0]} of ${b.facts.done[1]} live</span><span class="go">Open dashboard →</span></div></a>`; }).join('')}</div>
    <p class="note">Last 28 days: ${rng(...d.brands[0].windows.latest)}. Google publishes Search Console data two to three days late.</p></main>`;
  show('choose');
}
function kpi(label, now, was, kind, help, small){
  let v, dl, w;
  if (kind === 'ctr'){ v = now.toFixed(1) + '%'; dl = dPts(now, was); w = was.toFixed(1) + '%'; }
  else if (kind === 'pos'){ v = now == null ? 'n/a' : now.toFixed(1); dl = dPos(now, was, true); w = was == null ? 'n/a' : was.toFixed(1); }
  else { v = N(now); dl = dCount(now, was); w = N(was); }
  return `<div class="kpi${small ? ' small' : ''}"><div class="k">${label}</div><div class="v">${v}</div>
    <div class="row">${chip(dl)}<span class="was">was ${w}</span></div><div class="help">${help}</div></div>`;
}
function renderDash(){
  const d = S.data, b = d.brands.find(x => x.id === S.brand);
  if (!b){ location.hash = ''; return; }
  document.documentElement.style.setProperty('--accent', b.accent); document.documentElement.style.setProperty('--tint', b.tint);
  const W = b.windows, L = b.totals.latest, C = b.totals[S.cmp], f = b.facts;
  const segBtn = (k, label, r) => `<button type="button" data-cmp="${k}" aria-pressed="${S.cmp === k}">${label}<small>${r}</small></button>`;
  const pct = Math.round(f.done[0] / f.done[1] * 100);
  $('#dash').innerHTML = topbar(b.id) + `<main class="wrap">
  <div class="head"><div><h1>${esc(b.name)}</h1><div class="sub"><a href="https://${esc(b.domain)}/" target="_blank" rel="noopener">${esc(b.domain)}</a> · Last 28 days: ${rng(...W.latest)}</div></div>
    <div class="cmpbox"><span class="k">Compare with</span><div class="seg" role="group" aria-label="Compare with">
      ${segBtn('previous', 'Previous 28 days', rng(...W.previous))}${segBtn('start', 'Before we started', rng(...W.start))}</div></div></div>

  <div class="grid g4">
    ${kpi('Clicks from Google', L.clicks, C.clicks, 'n', 'People who clicked a result for the site.')}
    ${kpi('Views in Google', L.impr, C.impr, 'n', 'Times a page of the site was shown in results.')}
    ${kpi('Click rate', L.ctr, C.ctr, 'ctr', 'Share of views that became a click.')}
    ${kpi('Average position', L.pos, C.pos, 'pos', 'Lower is better. Page one is positions 1 to 10.')}
  </div>
  <div class="grid g4" style="margin-top:14px">
    ${kpi('Clicks without the brand name', L.nb_clicks, C.nb_clicks, 'n', 'New customers who did not search for the name.', 1)}
    ${kpi('Views without the brand name', L.nb_impr, C.nb_impr, 'n', 'Shown to people still choosing a brand.', 1)}
    ${kpi('Different searches showing the site', L.queries, C.queries, 'n', 'More searches means wider reach.', 1)}
    <div class="kpi small"><div class="k">Pages in Google's index</div><div class="v">${esc(f.indexed[1])}</div><div class="help">At the start: ${esc(f.indexed[0])}. Indexed pages can appear in search.</div></div>
  </div>
  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr));margin-top:14px">
    <div class="kpi small"><div class="k">October plan: pages and articles live</div><div class="v">${f.done[0]} of ${f.done[1]}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="help">${pct}% of this month's planned work is live on the site.</div></div>
    <div class="kpi small"><div class="k">Domain Rating (Ahrefs, 0 to 100)</div><div class="v">${esc(String(f.dr[1]).split(' (')[0])}</div><div class="help">Strength of links pointing to the site, ${esc((String(f.dr[1]).split(' (')[1] || '').replace(')', ''))}. It moves over months, not weeks.</div></div>
  </div>

  <section class="sec"><div class="sech"><div><h2>Where the site ranks in Google</h2>
    <p>Searches that showed the site at least ${d.min_views} times in the 28 days, grouped by their average position. Page one of Google is positions 1 to 10.</p></div>
    <div class="seg" role="group" aria-label="Searches"><button type="button" data-rank="all" aria-pressed="${S.rank === 'all'}">All searches</button><button type="button" data-rank="nb" aria-pressed="${S.rank === 'nb'}">Without the brand name</button></div></div>
    <div class="split"><div class="chartbox"><canvas id="chRank" aria-label="Searches by position"></canvas></div><div class="tw" id="rankTable"></div></div></section>

  <section class="sec"><div class="sech"><div><h2>Tracked keywords</h2>
    <p>The ${b.keywords.length} keywords our October plan pages are built to win, with Google's average position for each window. 1 is the top of the page.</p></div></div>
    <div class="pills" id="kwPills"></div>
    <div class="tools"><input class="inp" id="kwq" type="search" placeholder="Search keywords or pages" value="${esc(S.kwq)}" aria-label="Search keywords or pages">
      <select class="sel" id="kwb" aria-label="Position now">${[['all','All positions'],['0','Top 3 now'],['1','4 to 10 now'],['2','11 to 20 now'],['3','21 and lower now'],['none','Not showing yet']].map(([v,l]) => `<option value="${v}"${S.kwb === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
      <select class="sel" id="kws" aria-label="Sort">${[['now','Sort: position now'],['move','Sort: biggest move up'],['vol','Sort: searches a month']].map(([v,l]) => `<option value="${v}"${S.kwsort === v ? ' selected' : ''}>${l}</option>`).join('')}</select></div>
    <div class="tw"><table class="kt"><thead><tr><th>Keyword</th><th class="pg">Page</th><th class="n vol">Searches a month</th><th class="n">${H(cmpName(), 'Before')}</th><th class="n">${H('Last 28 days', 'Now')}</th><th class="n">Change</th></tr></thead><tbody id="kwBody"></tbody></table></div>
    <div class="more" id="kwMore"></div></section>

  <section class="sec"><div class="sech"><div><h2>Week by week</h2><p>The last 26 weeks, 7 days each, ending ${dm(b.last)}. The line marks when our work began.</p></div>
    <div class="seg" role="group" aria-label="Measure"><button type="button" data-tm="c" aria-pressed="${S.tm === 'c'}">Clicks</button><button type="button" data-tm="i" aria-pressed="${S.tm === 'i'}">Views</button></div></div>
    <div class="chartbox tall"><canvas id="chWeek" aria-label="Weekly trend"></canvas></div></section>

  <section class="sec"><div class="sech"><div><h2>Month by month</h2><p>Every month Google has data for. Months since we started are in color; the first and the current month are part months.</p></div>
    <div class="seg" role="group" aria-label="Measure"><button type="button" data-mm="c" aria-pressed="${S.mm === 'c'}">Clicks</button><button type="button" data-mm="i" aria-pressed="${S.mm === 'i'}">Views</button></div></div>
    <div class="chartbox tall"><canvas id="chMonth" aria-label="Monthly history"></canvas></div></section>

  <section class="sec"><div class="sech"><div><h2>Top pages</h2><p>Pages with the most clicks in the last 28 days.</p></div></div>
    <div class="tw" id="pagesTable"></div></section>

  <section class="sec"><div class="sech"><div><h2>Top searches</h2><p id="tqNote"></p></div>
    <div class="seg" role="group" aria-label="Searches"><button type="button" data-tq="all" aria-pressed="${S.tq === 'all'}">Most clicks</button><button type="button" data-tq="nb" aria-pressed="${S.tq === 'nb'}">Without the brand name</button></div></div>
    <div class="tw" id="queriesTable"></div></section>

  <p class="foot">Source: Google Search Console, final data to ${dm(b.last)} ${P(b.last).y}. Positions are Google's averages over each window, so a search that moves around shows its middle. Indexed pages come from Google's URL Inspection tool and Domain Rating from Ahrefs, on the dates shown. Prepared by LocknCode. Updated ${esc(d.updated)}.</p>
  </main>`;
  show('dash');
  renderRank(b); renderKw(b); renderPages(b); renderQueries(b); drawCharts(b);
}

// ---------- sections ----------
function renderRank(b){
  const bk = S.rank === 'all' ? b.buckets : b.buckets_nb;
  const was = bk[S.cmp], now = bk.latest;
  const rows = BL.map((l, i) => { const x = now[i] - was[i]; const c = i === 3 ? 'flat' : x > 0 ? 'good' : x < 0 ? 'bad' : 'flat';
    return `<tr><td>${l}</td><td class="n">${N(was[i])}</td><td class="n">${N(now[i])}</td><td class="n">${x ? chip({t:(x > 0 ? '+' : '') + x, c}) : chip({t:'No change', c:'flat'})}</td></tr>`; }).join('');
  const sw = was.reduce((a, c) => a + c, 0), sn = now.reduce((a, c) => a + c, 0), p1w = was[0] + was[1], p1n = now[0] + now[1];
  $('#rankTable').innerHTML = `<table class="rk"><thead><tr><th>Position</th><th class="n">${H(cmpName(), 'Before')}</th><th class="n">${H('Last 28 days', 'Now')}</th><th class="n">Change</th></tr></thead><tbody>${rows}
    <tr class="tot"><td>On page one (1 to 10)</td><td class="n">${N(p1w)}</td><td class="n">${N(p1n)}</td><td class="n">${chip(dCount(p1n, p1w))}</td></tr>
    <tr class="tot"><td>All searches counted</td><td class="n">${N(sw)}</td><td class="n">${N(sn)}</td><td class="n">${chip(dCount(sn, sw))}</td></tr></tbody></table>`;
}
function kwRows(b){
  return b.keywords.map(k => { const n = k.w.latest, w = k.w[S.cmp];
    return {k, now: n ? n[0] : null, nowI: n ? n[1] : 0, was: w ? w[0] : null, wasI: w ? w[1] : 0,
      move: n && w ? +(w[0] - n[0]).toFixed(1) : null, st: n && w ? 'both' : n ? 'new' : w ? 'lost' : 'none'}; });
}
function posCell(p, i){ if (p == null) return '<span class="muted">not showing</span>'; return i < 3 ? `<span class="low" title="Fewer than 3 views in the 28 days">${p.toFixed(1)}</span>` : p.toFixed(1); }
function renderKw(b){
  const all = kwRows(b);
  const page1 = all.filter(r => r.now != null && bucketOf(r.now) <= 1).length;
  const up = all.filter(r => r.move != null && r.move > 0.05).length, down = all.filter(r => r.move != null && r.move < -0.05).length;
  const nw = all.filter(r => r.st === 'new').length, none = all.filter(r => r.st === 'none').length;
  $('#kwPills').innerHTML = `<div class="pill"><b>${page1}</b>on page one now</div><div class="pill good"><b>${up}</b>moved up</div><div class="pill bad"><b>${down}</b>moved down</div><div class="pill good"><b>${nw}</b>newly showing</div><div class="pill"><b>${none}</b>not showing yet</div>`;
  const q = S.kwq.trim().toLowerCase();
  let rows = all.filter(r => (!q || r.k.kw.toLowerCase().includes(q) || r.k.page.toLowerCase().includes(q)) &&
    (S.kwb === 'all' || (S.kwb === 'none' ? r.now == null : r.now != null && String(bucketOf(r.now)) === S.kwb)));
  const big = 1e9;
  if (S.kwsort === 'vol') rows.sort((a, c) => (c.k.vol ?? -1) - (a.k.vol ?? -1));
  else if (S.kwsort === 'move') rows.sort((a, c) => (c.move ?? (c.st === 'new' ? 0.01 : -big)) - (a.move ?? (a.st === 'new' ? 0.01 : -big)));
  else rows.sort((a, c) => (a.now ?? big) - (c.now ?? big));
  const lim = S.kwall ? rows.length : 30;
  $('#kwBody').innerHTML = rows.slice(0, lim).map(r => {
    const ch = r.st === 'both' ? chip(dPos(r.now, r.was)) : r.st === 'new' ? chip({t:'New', c:'good'}) : r.st === 'lost' ? chip({t:H('Dropped out', 'Out'), c:'bad'}) : '';
    return `<tr><td class="kw">${esc(r.k.kw)}</td><td class="pg">${esc(r.k.page)}</td><td class="n vol">${r.k.vol != null ? N(r.k.vol) : '<span class="muted">n/a</span>'}</td>
      <td class="n">${posCell(r.was, r.wasI)}</td><td class="n">${posCell(r.now, r.nowI)}</td><td class="n">${ch}</td></tr>`; }).join('') ||
    '<tr><td colspan="6" class="muted">No keywords match.</td></tr>';
  $('#kwMore').innerHTML = rows.length > 30 ? `<button class="ghost" type="button" data-act="kwall">${S.kwall ? 'Show fewer' : `Show all ${rows.length}`}</button>` : '';
}
function trio(w){ return w ? w : null; }
const dec = s => { try { return decodeURIComponent(s); } catch (e) { return s; } };
function renderPages(b){
  $('#pagesTable').innerHTML = `<table class="pt"><thead><tr><th>Page</th><th class="n">Clicks</th><th class="n">${H('vs ' + cmpName().toLowerCase(), 'Change')}</th><th class="n hp">Views</th><th class="n">Position</th></tr></thead><tbody>` +
    b.pages.map(p => { const n = p.w.latest, w = trio(p.w[S.cmp]);
      return `<tr><td class="url"><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(dec(p.path))}</a></td><td class="n">${N(n[0])}</td><td class="n">${w ? chip(dCount(n[0], w[0])) : chip({t:'New', c:'good'})}</td><td class="n hp">${N(n[1])}</td><td class="n">${n[2].toFixed(1)}</td></tr>`; }).join('') + '</tbody></table>';
}
function renderQueries(b){
  const list = S.tq === 'all' ? b.queries : b.queries_nb;
  $('#tqNote').textContent = S.tq === 'all' ? 'The searches that brought the most clicks in the last 28 days (searches with at least 3 views).' : 'Searches without the brand name, by views: where new customers already see the site.';
  $('#queriesTable').innerHTML = `<table><thead><tr><th>Search</th><th class="n">Clicks</th><th class="n hp">Views</th><th class="n">Position</th><th class="n">${H('vs ' + cmpName().toLowerCase(), 'Change')}</th></tr></thead><tbody>` +
    list.map(q => { const n = q.w.latest, w = q.w[S.cmp];
      return `<tr><td class="kw">${esc(q.q)}${q.brand ? '<span class="tag">brand</span>' : ''}</td><td class="n">${N(n[0])}</td><td class="n hp">${N(n[1])}</td><td class="n">${n[2].toFixed(1)}</td><td class="n">${w ? chip(dPos(n[2], w[2])) : chip({t:'New', c:'good'})}</td></tr>`; }).join('') + '</tbody></table>';
}

// ---------- charts ----------
const markerPlugin = {id:'startMark', afterDatasetsDraw(ch, args, o){
  if (o == null || o.index == null || o.index < 0) return;
  const x = ch.scales.x.getPixelForValue(o.index), {top, bottom} = ch.chartArea, c = ch.ctx;
  c.save(); c.strokeStyle = o.color; c.setLineDash([5, 4]); c.lineWidth = 1.5; c.beginPath(); c.moveTo(x, top + 14); c.lineTo(x, bottom); c.stroke();
  c.setLineDash([]); c.fillStyle = o.color; c.font = '600 12px Inter, system-ui, sans-serif'; c.textAlign = x > ch.chartArea.right - 110 ? 'right' : 'left';
  c.fillText(o.label, x + (c.textAlign === 'left' ? 6 : -6), top + 10); c.restore(); }};
function drawCharts(b){
  for (const k in S.charts) { S.charts[k].destroy(); delete S.charts[k]; }
  if (!window.Chart && document.readyState !== 'complete'){ window.addEventListener('load', () => { if (S.brand === b.id) drawCharts(b); }, {once:true}); return; }
  if (!window.Chart){ for (const id of ['chRank','chWeek','chMonth']) { const el = $('#' + id); if (el) el.parentElement.innerHTML = '<p class="muted">The chart could not load. The tables still show every number.</p>'; } return; }
  const accent = b.accent, cmp = css('--cmp'), grid = '#E9EEF0', ink = '#13222A';
  Chart.defaults.font.family = 'Inter, system-ui, sans-serif'; Chart.defaults.color = '#5C6C74';
  const bk = S.rank === 'all' ? b.buckets : b.buckets_nb;
  S.charts.rank = new Chart($('#chRank'), {type:'bar', data:{labels:BL, datasets:[
      {label:cmpName(), data:bk[S.cmp], backgroundColor:cmp, borderRadius:6, maxBarThickness:46},
      {label:'Last 28 days', data:bk.latest, backgroundColor:accent, borderRadius:6, maxBarThickness:46}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'bottom', labels:{boxWidth:12, boxHeight:12, usePointStyle:true, pointStyle:'rectRounded'}},
      tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${N(c.raw)} searches`}}},
      scales:{x:{grid:{display:false}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
  const wk = b.weekly, si = wk.findIndex(w => w.from <= S.data.started && S.data.started <= w.to);
  S.charts.week = new Chart($('#chWeek'), {type:'line', data:{labels:wk.map(w => dm(w.from)), datasets:[{label:S.tm === 'c' ? 'Clicks' : 'Views', data:wk.map(w => w[S.tm]),
      borderColor:accent, backgroundColor:accent + '22', fill:true, tension:.3, pointRadius:3, pointHoverRadius:5, pointBackgroundColor:accent}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}, startMark:{index:si, label:'Work started, 1 Sep', color:ink},
      tooltip:{callbacks:{title:c => { const w = wk[c[0].dataIndex]; return rng(w.from, w.to); }, label:c => ` ${N(c.raw)} ${S.tm === 'c' ? 'clicks' : 'views'}`}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:9}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}},
    plugins:[markerPlugin]});
  const mo = b.monthly, started = S.data.started.slice(0, 7);
  S.charts.month = new Chart($('#chMonth'), {type:'bar', data:{labels:mo.map(m => `${MON[+m.m.slice(5) - 1]} ${m.m.slice(0, 4)}`), datasets:[{label:S.mm === 'c' ? 'Clicks' : 'Views',
      data:mo.map(m => m[S.mm]), backgroundColor:mo.map(m => m.m >= started ? (m.partial ? accent + '99' : accent) : (m.partial ? cmp + '99' : cmp)), borderRadius:5, maxBarThickness:40}]},
    options:{responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false},
      tooltip:{callbacks:{label:c => { const m = mo[c.dataIndex]; let s = ` ${N(c.raw)} ${S.mm === 'c' ? 'clicks' : 'views'}`; if (m.partial) s += m.to ? ` (to ${dm(m.to)})` : m.from ? ` (from ${dm(m.from)})` : ' (part month)'; return s; }}}},
      scales:{x:{grid:{display:false}, ticks:{maxRotation:0, autoSkip:true, maxTicksLimit:9}}, y:{beginAtZero:true, grid:{color:grid}, ticks:{precision:0}}}}});
}

// ---------- routing and events ----------
function route(){
  if (!S.data){ show('lock'); setTimeout(() => $('#pw').focus(), 50); return; }
  const id = location.hash.replace('#', '');
  if (S.data.brands.some(b => b.id === id)){ if (S.brand !== id){ S.kwq = ''; S.kwb = 'all'; S.kwall = false; } S.brand = id; renderDash(); }
  else { S.brand = null; renderChoose(); }
}
async function unlock(pw, silent){
  const btn = $('#unlockbtn'), err = $('#lockerr');
  btn.disabled = true; btn.textContent = 'Opening...'; err.textContent = '';
  try { S.data = await decrypt(pw); store.set('lnc_pw', pw); try { S.cmp = store.get('lnc_cmp') || 'previous'; } catch (e) {} route(); }
  catch (e) { store.del('lnc_pw'); if (!silent) err.textContent = e.message === 'password' ? 'That password did not work. Check it and try again.' : 'The data could not load. Check the connection and reload the page.'; show('lock'); }
  finally { btn.disabled = false; btn.textContent = 'Open dashboard'; }
}
$('#lockform').addEventListener('submit', e => { e.preventDefault(); const pw = $('#pw').value; if (pw) unlock(pw, false); });
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act],[data-cmp],[data-rank],[data-tm],[data-mm],[data-tq]');
  if (!t) return;
  const b = S.data && S.data.brands.find(x => x.id === S.brand);
  if (t.dataset.act === 'lock'){ store.del('lnc_pw'); S.data = null; $('#pw').value = ''; $('#choose').innerHTML = ''; $('#dash').innerHTML = ''; history.replaceState(null, '', location.pathname); route(); return; }
  if (!b) return;
  if (t.dataset.act === 'kwall'){ S.kwall = !S.kwall; renderKw(b); return; }
  if (t.dataset.cmp){ S.cmp = t.dataset.cmp; store.set('lnc_cmp', S.cmp); const y = window.scrollY; renderDash(); window.scrollTo(0, y); return; }
  const y = window.scrollY;
  if (t.dataset.rank) S.rank = t.dataset.rank;
  if (t.dataset.tm) S.tm = t.dataset.tm;
  if (t.dataset.mm) S.mm = t.dataset.mm;
  if (t.dataset.tq) S.tq = t.dataset.tq;
  renderDash(); window.scrollTo(0, y);
});
let kwTimer = null;
document.addEventListener('input', e => {
  const b = S.data && S.data.brands.find(x => x.id === S.brand); if (!b) return;
  if (e.target.id === 'kwq'){ clearTimeout(kwTimer); kwTimer = setTimeout(() => { S.kwq = e.target.value; renderKw(b); }, 120); }
});
document.addEventListener('change', e => {
  const b = S.data && S.data.brands.find(x => x.id === S.brand); if (!b) return;
  if (e.target.id === 'kwb'){ S.kwb = e.target.value; renderKw(b); }
  if (e.target.id === 'kws'){ S.kwsort = e.target.value; renderKw(b); }
});
window.addEventListener('hashchange', route);
const saved = store.get('lnc_pw');
if (saved) unlock(saved, true); else route();
})();
</script>
</body>
</html>
